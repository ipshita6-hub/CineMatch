services:
  - type: web
    name: cinematch-api
    runtime: python
    plan: free
    # Install the CPU-only torch wheel FIRST. requirements.txt pins torch==2.15.0,
    # which 2.15.0+cpu satisfies, so pip never reaches PyPI's default build and its
    # ~2.5 GB of unused NVIDIA CUDA packages. Then fetch the trained artifacts that
    # are too large for git (SHA-256 pinned in the fetch script).
    buildCommand: >-
      pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu &&
      pip install -r requirements.txt &&
      python scripts/fetch_deployment_artifacts.py &&
      python scripts/prepare_mmap_artifacts.py
    startCommand: python scripts/start_render.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: WEB_CONCURRENCY
        value: "1"
      # Serve NeuMF + hybrid + popularity only, skipping the MF baseline and the
      # rating predictor. Measured in the uvicorn process, with the memory-mapped
      # seen index in place:
      #   this config          442 MB idle / 469 MB under load   (fits 512 MB)
      #   all four models      558 MB idle / 585 MB under load   (OOM-killed)
      # Without the mmap sidecars it was 520 / 525, which is what crash-looped the
      # free instance. Remove this on a 2 GB plan to restore the model switcher and
      # predicted star ratings.
      - key: LIGHT_INFERENCE
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: NEUMF_ARTIFACT_URL
        sync: false
      - key: MF_ARTIFACT_URL
        sync: false
      - key: RATING_ARTIFACT_URL
        sync: false
      - key: SEEN_ARTIFACT_URL
        sync: false
